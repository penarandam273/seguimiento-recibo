# Compila la app de Android (APK) con la misma pagina adentro y la publica en "Releases".
# La pagina web sigue funcionando igual: este flujo solo agrega la app.
# Necesita dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   LLAVE_APK        → la llave de firma en base64 (siempre la misma: asi cada version se instala encima)
#   CLAVE_LLAVE_APK  → la clave de esa llave
name: App Android

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'entorno.js'
      - 'android/**'
      - '.github/workflows/app-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar la llave de firma
        env:
          LLAVE_APK: ${{ secrets.LLAVE_APK }}
          CLAVE_LLAVE_APK: ${{ secrets.CLAVE_LLAVE_APK }}
        run: |
          if [ -z "$LLAVE_APK" ] || [ -z "$CLAVE_LLAVE_APK" ]; then
            echo "::error::Faltan los secretos LLAVE_APK y CLAVE_LLAVE_APK (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          F="$RUNNER_TEMP/llave.p12"
          # si los dos secretos quedaron cambiados de lugar (la llave es el texto largo), se acomodan solos
          if [ "$(printf '%s' "$LLAVE_APK" | wc -c)" -lt "$(printf '%s' "$CLAVE_LLAVE_APK" | wc -c)" ]; then
            echo "Los secretos estaban cambiados de lugar: se usan al revés."
            T="$LLAVE_APK"; LLAVE_APK="$CLAVE_LLAVE_APK"; CLAVE_LLAVE_APK="$T"
          fi
          echo "CLAVE_LLAVE_APK=$CLAVE_LLAVE_APK" >> "$GITHUB_ENV"
          # se limpian espacios y saltos de línea que a veces quedan al pegar
          printf '%s' "$LLAVE_APK" | tr -d ' \r\n\t' | base64 -d > "$F" 2>/dev/null || true
          echo "Largo del secreto LLAVE_APK: $(printf '%s' "$LLAVE_APK" | tr -d ' \r\n\t' | wc -c) caracteres (debe ser 3552) · largo de CLAVE_LLAVE_APK: $(printf '%s' "$CLAVE_LLAVE_APK" | wc -c) (debe ser 36)"
          if ! keytool -list -storetype pkcs12 -keystore "$F" -storepass "$CLAVE_LLAVE_APK" -alias recibo >/dev/null 2>"$RUNNER_TEMP/k.txt"; then
            # por si se pegó codificado dos veces
            tr -d ' \r\n\t' < "$F" | base64 -d > "$F.2" 2>/dev/null && keytool -list -storetype pkcs12 -keystore "$F.2" -storepass "$CLAVE_LLAVE_APK" -alias recibo >/dev/null 2>&1 && mv "$F.2" "$F"
          fi
          if ! keytool -list -storetype pkcs12 -keystore "$F" -storepass "$CLAVE_LLAVE_APK" -alias recibo >/dev/null 2>&1; then
            echo "::error::La llave de firma no se pudo abrir: $(head -c 200 "$RUNNER_TEMP/k.txt"). Revisa que LLAVE_APK tenga TODO el texto de LLAVE_APK.txt y CLAVE_LLAVE_APK el de CLAVE_LLAVE_APK.txt (sin cambiarlos de lugar)."
            exit 1
          fi
          echo "Llave de firma revisada: OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Meter la pagina dentro de la app (funciona sin senal)
        run: |
          W=android/app/src/main/assets/web
          mkdir -p "$W/lib"
          cp index.html entorno.js "$W/"
          # Las librerias de PDF y Excel van dentro de la app para que exporte sin internet
          curl -sSfL -o "$W/lib/exceljs.min.js" https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js
          curl -sSfL -o "$W/lib/jspdf.umd.min.js" https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js
          curl -sSfL -o "$W/lib/jspdf.plugin.autotable.min.js" https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js
          sed -i \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js#lib/exceljs.min.js#' \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#lib/jspdf.umd.min.js#' \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js#lib/jspdf.plugin.autotable.min.js#' \
            "$W/index.html"
          grep -c "lib/jspdf" "$W/index.html"

      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
          LLAVE_RUTA: ${{ runner.temp }}/llave.p12
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk SeguimientoRecibo.apk
          ls -la SeguimientoRecibo.apk

      - name: Publicar la version (el boton "Descargar app" siempre baja la ultima)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          # Si se vuelve a correr la misma compilacion, la version ya existe: se reemplaza el APK en vez de fallar
          if gh release view "app-v$V" >/dev/null 2>&1; then
            gh release upload "app-v$V" SeguimientoRecibo.apk --clobber
            echo "La version app-v$V ya existia: se reemplazo su APK."
          else
            gh release create "app-v$V" SeguimientoRecibo.apk \
              --title "Seguimiento de Recibo $V (Android)" \
              --notes "Instala SeguimientoRecibo.apk en el celular. Se actualiza encima de la version anterior sin borrar nada." \
              --latest
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SeguimientoRecibo-apk
          path: SeguimientoRecibo.apk
