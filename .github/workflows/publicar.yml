# Publica la pagina en GitHub Pages cada vez que se sube un cambio a main.
# En el repositorio: Settings -> Pages -> Source: GitHub Actions.
name: Publicar Seguimiento de Recibo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar solo la pagina (sin la carpeta nube)
        run: mkdir -p sitio && cp index.html entorno.js icono-180.png .nojekyll sitio/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
